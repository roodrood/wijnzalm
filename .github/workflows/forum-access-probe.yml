name: Wine forum access probe
on:
  push:
    branches: [feature/forum-access-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Forum connectivity and robots checks
        run: python tools/probe_forums.py --output probe-results
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wineforum-connection-report
          path: probe-results/
          if-no-files-found: warn
